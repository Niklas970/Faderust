name: "CodeQL Advanced"

# Advanced setup with a path filter (the template cannot do that): on pull
# requests and pushes to main, each language is only analysed when its own files
# changed. The Rust analysis is the slowest check by far (about 6 minutes), and
# it ran again on main after every merge. The weekly run (and a manual one)
# always analyses everything, so nothing goes stale.
#
# Faster again: a draft pull request is not analysed (the check shows as
# skipped, which a branch rule accepts) and is analysed when it is marked
# ready for review; a new push cancels the run of the previous one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 11 * * 5"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Not for drafts; pushes and the schedule have no pull request.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            # Source and manifests; the lock file decides what gets compiled.
            files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/codeql\.yml$'
          - language: javascript-typescript
            files: '^streamdeck/|^\.github/workflows/codeql\.yml$'
          - language: actions
            files: '^\.github/|^\.github/workflows/codeql\.yml$'
    steps:
      - uses: actions/checkout@v7
        with:
          # Whole history: a push needs the commit before it, a pull request
          # its base. The repository is small.
          fetch-depth: 0
      # The check stays green when nothing relevant changed, so a branch rule
      # that requires it is not left waiting.
      - name: Does this change touch ${{ matrix.language }}?
        id: scope
        env:
          FILES: ${{ matrix.files }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="HEAD^1 HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Not for the first push of a branch or after a force push, where
            # the previous commit is missing: those analyse everything.
            range="$BEFORE $GITHUB_SHA"
          fi
          if [ -n "$range" ] && ! git diff --name-only $range | grep -Eq "$FILES"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.language }} files changed: skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v4
        if: steps.scope.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        if: steps.scope.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}
