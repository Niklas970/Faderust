name: Test build

# Builds the branch you pick (Run workflow, "Use workflow from") as a signed
# setup and pushes it to the package ghcr.io/niklas970/faderust-test under the
# tag "<branch>" (one per branch, each run replaces the previous one of its
# branch). Faderust lists the tags when "Testversionen" is on in the Devices
# dialog; you pick the branch there and it updates itself: no download, no
# version bump, no release, nothing on the releases page. A real release
# deletes the package again (release.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: test-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci && npm run build && npm run pack
        working-directory: streamdeck
      - name: Ship the plugin with the app
        run: |
          mkdir -p stage/resources
          cp streamdeck/dist/*.streamDeckPlugin stage/resources/
          jq -r .Version streamdeck/com.niklas970.faderust.sdPlugin/manifest.json \
            > stage/resources/streamdeck-plugin.version
      # The build id tells the app which test build it is, so it offers only
      # another one.
      - name: Build
        run: |
          echo "BUILD=${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          FADERUST_BUILD="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" cargo build --release -p faderust
      - name: Build setup
        run: |
          choco install nsis -y --no-progress
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 \
            "-DVERSION=$VERSION" \
            "-DEXE=$(cygpath -aw target/release/faderust.exe)" \
            "-DRESOURCES=$(cygpath -aw stage/resources)" \
            "-DOUTFILE=$(cygpath -w "$PWD/Faderust_${VERSION}_x64-setup.exe")" \
            installer/faderust.nsi
      - name: Sign setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "Signing key missing"; exit 1; }
          npx --yes @tauri-apps/cli@2.12.4 signer sign "Faderust_${VERSION}_x64-setup.exe"
      - name: Collect files
        run: |
          mkdir release
          cp Faderust_*_x64-setup.exe Faderust_*_x64-setup.exe.sig release/
          echo "$BUILD" > release/build.txt
      - uses: actions/upload-artifact@v7
        with:
          name: test-files
          path: release/*
          if-no-files-found: error

  # Separate job so only it can write to the package.
  publish:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-files
          path: release
      - uses: oras-project/setup-oras@v1
      - name: Push the build to the test package
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Branch name as a tag: "claude/x y" becomes "claude-x-y".
          tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | sed -E 's/^[^A-Za-z0-9]+//' | cut -c1-120)
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd release
          setup=$(ls *-setup.exe)
          # One tag per branch; a new run replaces the previous build. The
          # app reads version and build from the annotations.
          oras push "ghcr.io/niklas970/faderust-test:$tag" \
            --artifact-type application/vnd.faderust.test \
            --annotation "version=$(grep -m1 '^version' "$GITHUB_WORKSPACE/Cargo.toml" | sed -E 's/.*"(.*)".*/\1/')" \
            --annotation "build=$(cat build.txt)" \
            --annotation "title=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%s "$GITHUB_SHA" | cut -c1-80)" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=Faderust test builds, one tag per branch" \
            "$setup" "$setup.sig"
