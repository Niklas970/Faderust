<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Pegel setzen</title>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="status" class="status" hidden>Faderust läuft nicht. Starte Faderust, dann erscheinen hier die Auswahllisten.</div>
    <div class="item"><label for="input">Eingang</label><select id="input" data-setting="input" data-source="inputs" data-type="number" data-extra="-1|Master eines Ausgangs"></select></div>
    <div class="item"><label for="output">Ausgang</label><select id="output" data-setting="output" data-source="outputs" data-type="number" data-extra="-1|Ganzer Streifen (alle Ausgänge)"></select></div>
    <div class="item"><label for="db">Pegel (dB)</label><input id="db" type="number" step="0.5" min="-60" placeholder="0" data-setting="db" data-type="number" /></div>
    <p class="hint">Eingang und Ausgang: ein einzelner Fader. Eingang mit „Ganzer Streifen“: der Streifen wie im Pult. „Master eines Ausgangs“ mit einem Ausgang: dessen Master-Fader. Die Taste setzt den Pegel bei jedem Druck.</p>
    <script src="pi.js"></script>
  </body>
</html>
