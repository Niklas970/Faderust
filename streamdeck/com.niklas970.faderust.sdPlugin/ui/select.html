<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Auswählen</title>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="status" class="status" hidden>Faderust läuft nicht. Starte Faderust, dann erscheinen hier die Auswahllisten.</div>
    <div class="item"><label for="target">Fader</label><select id="target" data-setting="target" data-source="targets" data-extra="clear|Auswahl leeren"></select></div>
    <p class="hint">Jeder Druck wählt den Streifen oder Master aus (leuchtet) oder hebt die Auswahl wieder auf. „Auswahl leeren“ hebt alles auf. Eine Taste „Lauter / Leiser“ mit „Auswahl verwenden“ bewegt dann genau diese Fader.</p>
    <script src="pi.js"></script>
  </body>
</html>
